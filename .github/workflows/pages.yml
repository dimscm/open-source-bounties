# Menyalakan dan mengisi GitHub Pages langsung dari Actions, tanpa perlu
# membuka menu Settings (menu itu tidak ada di aplikasi GitHub versi HP).
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job ini sengaja tidak memakai "environment: github-pages". Selama Pages
  # belum aktif, environment tersebut belum mengizinkan branch apa pun, jadi
  # job yang memakainya akan ditolak sebelum sempat menyalakan Pages.
  siapkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement: true menyalakan Pages lewat API kalau belum aktif.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: siapkan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
